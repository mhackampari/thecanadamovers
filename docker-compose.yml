services:
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mock-api

  mock-api:
    build:
      context: ./docker/mock-api
    expose:
      - "3001"
    environment:
      - PORT=3001
